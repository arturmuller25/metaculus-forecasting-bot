name: Prever torneio

# POR QUE ESTE WORKFLOW E UM LOOP, E NAO UM CRON SIMPLES
#
# A regra da Metaculus, verbatim: "These will launch at random hours during
# the week and will be open for 1.5 hours each." Pergunta perdida conta zero
# numa formula de premio que eleva o total ao quadrado. Cada janela perdida
# sai cara.
#
# O cron do GitHub Actions NAO e confiavel para isso. Medido neste
# repositorio em 2026-09-19: agendado para cada 30 minutos, o intervalo real
# entre execucoes ficou entre 2 e 5 horas. E comportamento documentado do
# GitHub ("the schedule event can be delayed during periods of high load"),
# pior em repositorio novo e de pouca atividade.
#
# A solucao: cada execucao agendada fica VIVA por ate 5h30, prevendo a cada
# 20 minutos. O agendamento continua disparando, atrasado ou nao, e a proxima
# execucao entra na fila (grupo de concorrencia) e assume quando a atual
# terminar. Mesmo com o GitHub atrasando 5 horas, sempre ha uma execucao
# rodando. O teto de 6 horas por job do GitHub e o limite duro; 5h30 deixa
# margem para a ultima previsao terminar.
#
# Custo: uma iteracao sem pergunta nova gasta uma chamada de API e nada de
# LLM. Repositorio publico tem minutos de Actions ilimitados.
#
# Minutos "fora de pico" (7 e 37 em vez de 0 e 30) porque o GitHub atrasa
# mais nas viradas de hora, quando todo mundo agenda.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Onde prever"
        required: true
        default: test
        type: choice
        options: [test, tournament, minibench, cup, market_pulse]
      publish:
        description: "Publicar de verdade na Metaculus"
        required: true
        default: false
        type: boolean
      loop:
        description: "Ficar em loop por 5h30 (como o agendado) em vez de rodar uma vez"
        required: true
        default: false
        type: boolean

# Uma execucao por vez. A proxima agendada espera na fila em vez de rodar em
# paralelo e mandar duas previsoes para a mesma pergunta.
concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    # Teto duro do GitHub e 360. O loop para sozinho em ~330 e este valor
    # so existe para o caso de uma previsao travar.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: Rodar o bot
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CALIBRATION_A: ${{ vars.CALIBRATION_A }}
          CALIBRATION_B: ${{ vars.CALIBRATION_B }}
          # Provedores de pesquisa extras. Secret ausente chega vazio e o bot
          # ignora aquele provedor, entao da para cadastrar so os que tiver.
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Execucao automatica: para valer, publica, e fica em loop.
            MODE=tournament
            PUBLISH=true
            LOOP=true
          else
            # Execucao manual: obedece exatamente o que foi escolhido no botao.
            MODE="${{ github.event.inputs.mode }}"
            PUBLISH="${{ github.event.inputs.publish }}"
            LOOP="${{ github.event.inputs.loop }}"
          fi

          ARGS="--mode $MODE"
          if [ "$PUBLISH" = "true" ]; then ARGS="$ARGS --publish"; fi
          # Teste manual limitado a 3 perguntas: prova os tres tipos por
          # ~US$ 1,90 em vez de rodar as 10 da area de testes por ~US$ 6
          # (medido em 2026-09-22: US$ 0,63 por pergunta).
          if [ "$MODE" = "test" ]; then ARGS="$ARGS --limit 3"; fi
          echo "modo=$MODE publicar=$PUBLISH loop=$LOOP args=[$ARGS]"

          if [ "$LOOP" != "true" ]; then
            uv run python main.py $ARGS
            exit $?
          fi

          # ---- loop de 5h30, prevendo a cada 20 minutos ----
          INICIO=$(date +%s)
          TETO=$((5 * 3600 + 30 * 60))
          PAUSA=$((20 * 60))
          ITER=0
          while :; do
            ITER=$((ITER + 1))
            echo "::group::iteracao $ITER  ($(date -u +%H:%M:%S) UTC)"
            # Uma iteracao que falha (rede, limite de requisicao, erro numa
            # pergunta) NAO pode derrubar o loop: o proximo ciclo tenta de novo.
            uv run python main.py $ARGS || echo "iteracao $ITER falhou, seguindo"
            echo "::endgroup::"
            AGORA=$(date +%s)
            if [ $((AGORA - INICIO + PAUSA)) -ge $TETO ]; then
              echo "teto de tempo atingido apos $ITER iteracoes; encerrando para a proxima execucao assumir"
              break
            fi
            sleep $PAUSA
          done

      - name: Guardar relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 30
