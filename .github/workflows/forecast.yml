name: Forecast

# Why this workflow loops instead of relying on cron alone: questions open at
# random times and stay open for a limited window (1.5 hours in the seasonal
# tournament, 3 hours on MiniBench), while scheduled runs here started 2 to 5
# hours apart instead of every 30 minutes (measured 2026-09-19). So each
# scheduled run stays alive for up to 5.5 hours and checks for new questions
# every 20 minutes, and the next run waits in the concurrency group and takes
# over. Cron alone still left a gap of over 2 hours (2026-09-28), so every
# production run also queues its successor when it starts; cron is the backup.
# To stop the bot, disable this workflow. An iteration with no new question
# costs one API call and no LLM tokens. Cron uses off-peak minutes, which
# GitHub delays less.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Where to forecast"
        required: true
        default: test
        type: choice
        options: [test, tournament, minibench, cup, market_pulse]
      publish:
        description: "Submit forecasts to Metaculus"
        required: true
        default: false
        type: boolean
      loop:
        description: "Loop for 5.5 hours like the scheduled run, instead of running once"
        required: true
        default: false
        type: boolean

# One run at a time, so two runs never forecast the same question.
concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19, mid-season.
    runs-on: ubuntu-24.04
    # GitHub's hard limit is 360 minutes. The loop stops starting
    # iterations at 280 minutes and the bot step has its own 340-minute
    # limit, so the closing steps (coverage check, records) always run.
    timeout-minutes: 355
    permissions:
      contents: read
      actions: write # to queue the next run
      issues: write # alerts.py opens an issue when a run hides a problem
    env:
      # "true" when the repository has the secret CLAUDE_CODE_OAUTH_TOKEN (a
      # step's `if` cannot read secrets). Without it no step below changes.
      HAS_CLAUDE_CODE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      # Read by the Claude Code CLI only: it stays on the installed version.
      DISABLE_AUTOUPDATER: "1"
    steps:
      - name: Queue the next run
        # Production runs only: scheduled, or manual with tournament, publish
        # and loop. The queued run waits until this one ends; a newer queued
        # run replaces it, so there is never more than one waiting.
        if: github.event_name == 'schedule' || (github.event.inputs.mode == 'tournament' && github.event.inputs.publish == 'true' && github.event.inputs.loop == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh workflow run forecast.yml --ref "${{ github.ref_name }}"
          -f mode=tournament -f publish=true -f loop=true
          || echo "could not queue the next run; cron remains the backup"

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install the Claude Code CLI
        # For the forecasters in cc_forecaster.py, which run on the bot
        # maker's Claude subscription. The version is pinned: the flags and
        # the checks of that module were tested on it. A failed install does
        # not stop the run: the bot skips those forecasters with one log line.
        if: env.HAS_CLAUDE_CODE == 'true'
        run: |
          timeout 300 npm install -g @anthropic-ai/claude-code@2.1.325 && claude --version \
            || echo "::warning::The Claude Code CLI was not installed; its forecasters are skipped in this run"

      - name: Run the bot
        timeout-minutes: 340
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Optional key of your own, used when the tournament key runs low.
          OPENROUTER_FALLBACK_KEY: ${{ secrets.OPENROUTER_FALLBACK_KEY }}
          # Optional Anthropic API key: Claude members are called directly
          # first, with OpenRouter as the fallback.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FALLBACK_BELOW: ${{ vars.FALLBACK_BELOW }}
          CALIBRATION_A: ${{ vars.CALIBRATION_A }}
          CALIBRATION_B: ${{ vars.CALIBRATION_B }}
          # Optional research providers. A missing secret arrives empty and
          # the bot skips that provider.
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          SHADOW_MODELS: ${{ vars.SHADOW_MODELS }}
          # Members without tools (empty: the default pair in main.py) and the
          # reserve that joins the pool when fewer than two members answer.
          # A member on the Claude Code CLI is written
          # claudecode/<model>@<effort>|<fallback model>.
          ENSEMBLE_MODELS: ${{ vars.ENSEMBLE_MODELS }}
          RESERVE_MODEL: ${{ vars.RESERVE_MODEL }}
          # Primary web research model (empty: the default in main.py);
          # "none" leaves that source out of the briefing.
          RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL }}
          # Deferred panel experiments, recorded only (gap_fill.py,
          # supervisor.py): "1" turns each on; PANEL_SHARE samples questions.
          GAP_FILL: ${{ vars.GAP_FILL }}
          SUPERVISOR: ${{ vars.SUPERVISOR }}
          PANEL_SHARE: ${{ vars.PANEL_SHARE }}
          DEFERRED_MAX_PER_RUN: ${{ vars.DEFERRED_MAX_PER_RUN }}
          DEFERRED_BUDGET_S: ${{ vars.DEFERRED_BUDGET_S }}
          # "1" makes the agentic forecaster a member (see main.py); the spec
          # names which one (empty: agent/claude-sonnet-5-5@xhigh).
          AGENT_MEMBER: ${{ vars.AGENT_MEMBER }}
          AGENT_MEMBER_SPEC: ${{ vars.AGENT_MEMBER_SPEC }}
          # Forecasters on the Claude Code CLI (cc_forecaster.py), named in
          # SHADOW_MODELS as claudecode/<model>@<effort> or
          # claudecode-agent/<model>@<effort> and recorded only. The token of
          # the bot maker's Claude subscription (`claude setup-token`) goes to
          # this step alone; without it they are skipped. RUN_DEADLINE_S:
          # seconds from the start of main.py by which their calls end
          # (empty: 1320, inside the 1500 of the loop below). CC_MAX_PARALLEL:
          # CLI processes at once (empty: the default in cc_forecaster.py).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RUN_DEADLINE_S: ${{ vars.RUN_DEADLINE_S }}
          CC_MAX_PARALLEL: ${{ vars.CC_MAX_PARALLEL }}
          # An ISO time before which no Claude Code call is made.
          CC_NOT_BEFORE: ${{ vars.CC_NOT_BEFORE }}
          # Seconds a Claude Code member has for a question before its
          # fallback model answers (empty: 240).
          CC_MEMBER_TIME_LIMIT: ${{ vars.CC_MEMBER_TIME_LIMIT }}
          # Tournaments outside FutureEval, run Claude-only (Anthropic key),
          # comma-separated modes, e.g. "market_pulse,animal_futures".
          EXTRA_MODES: ${{ vars.EXTRA_MODES }}
          # Listing by schedule in those modes (main.py, _add_open_by_time):
          # "0" turns it off; hours during which a question the API does not
          # call open is still tried (empty: 0, never).
          OPEN_BY_TIME: ${{ vars.OPEN_BY_TIME }}
          OPEN_BY_TIME_HOURS: ${{ vars.OPEN_BY_TIME_HOURS }}
          # "0" turns off the rendering reader of resolution sources
          # (rendered_fetch.py).
          RENDERED_FETCH: ${{ vars.RENDERED_FETCH }}
        run: |
          set -uo pipefail
          # A copy of everything printed, for alerts.py (the last step).
          mkdir -p logs
          exec > >(tee -a logs/run_output.txt) 2>&1
          trap 'sleep 2' EXIT # lets tee write the last lines
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Scheduled run: tournament mode, publish, loop.
            MODE=tournament
            PUBLISH=true
            LOOP=true
          else
            # Manual run: exactly what was chosen in the form.
            MODE="${{ github.event.inputs.mode }}"
            PUBLISH="${{ github.event.inputs.publish }}"
            LOOP="${{ github.event.inputs.loop }}"
          fi

          ARGS="--mode $MODE"
          if [ "$PUBLISH" = "true" ]; then ARGS="$ARGS --publish"; fi
          # Manual tests are limited to 3 questions, one per type.
          if [ "$MODE" = "test" ]; then ARGS="$ARGS --limit 3"; fi
          echo "mode=$MODE publish=$PUBLISH loop=$LOOP args=[$ARGS]"

          if [ "$LOOP" != "true" ]; then
            uv run python main.py $ARGS
            exit $?
          fi

          # ---- loop for about 5 hours, forecasting every 20 minutes ----
          # Each call has a time limit, so a hung process (seen on 2026-10-09)
          # is killed and the loop goes on: 25 minutes for the main call, 15
          # for each extra tournament. The last iteration starts by 280
          # minutes, so even the slowest one ends before the step's limit.
          START=$(date +%s)
          CAP=$((4 * 3600 + 40 * 60))
          PAUSE=$((20 * 60))
          ITER=0
          while :; do
            ITER=$((ITER + 1))
            ITER_START=$(date +%s)
            echo "::group::iteration $ITER  ($(date -u +%H:%M:%S) UTC)"
            # A failed iteration (network, rate limit, one bad question) must
            # not stop the loop; the next cycle tries again.
            timeout 1500 uv run python main.py $ARGS || echo "iteration $ITER failed or timed out, continuing"
            if [ "$PUBLISH" = "true" ] && [ -n "${EXTRA_MODES:-}" ] && [ -n "${ANTHROPIC_API_KEY:-}" ]; then
              for EXTRA in $(echo "$EXTRA_MODES" | tr ',' ' '); do
                timeout 900 uv run python main.py --mode "$EXTRA" --publish --claude-only || echo "extra mode $EXTRA failed or timed out, continuing"
              done
            fi
            echo "::endgroup::"
            NOW=$(date +%s)
            # Iterations start every 20 minutes: a long one (new questions,
            # then the deferred shadows) shortens the pause instead of
            # pushing the next check for new questions later.
            WAIT=$((PAUSE - (NOW - ITER_START)))
            if [ $WAIT -lt 60 ]; then WAIT=60; fi
            if [ $((NOW - START + WAIT)) -ge $CAP ]; then
              echo "time cap reached after $ITER iterations; stopping so the next run takes over"
              break
            fi
            sleep $WAIT
          done

      - name: Check for missed questions
        if: always()
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: mkdir -p logs && uv run python coverage_check.py --hours 6 | tee logs/coverage.txt || echo "coverage check failed, ignoring"

      - name: Alert on hidden problems
        # Production runs only, and only with the repository variable ALERTS=1
        # (issues in a public repository are public). The loop swallows failed
        # iterations, so a run ends green with every Claude-only question
        # failed: this opens an issue assigned to the owner (one per problem,
        # not repeated while open).
        if: always() && vars.ALERTS == '1' && (github.event_name == 'schedule' || github.event.inputs.publish == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ALERT_KEY_BELOW: ${{ vars.ALERT_KEY_BELOW }}
        run: uv run python alerts.py logs/run_output.txt logs/coverage.txt || echo "alerts failed, ignoring"

      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 30

      - name: Keep forecast records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-records-${{ github.run_id }}
          path: logs/forecasts.jsonl
          if-no-files-found: ignore
          retention-days: 90
