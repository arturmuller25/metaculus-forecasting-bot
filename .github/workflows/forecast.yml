name: Forecast

# Why this workflow loops instead of relying on cron alone: questions open at
# random times and stay open for a limited window (1.5 hours in the seasonal
# tournament, 3 hours on MiniBench), while scheduled runs here started 2 to 5
# hours apart instead of every 30 minutes (measured 2026-09-19). So each
# scheduled run stays alive for up to 5.5 hours and checks for new questions
# every 20 minutes, and the next run waits in the concurrency group and takes
# over. Cron alone still left a gap of over 2 hours (2026-09-28), so every
# production run also queues its successor when it starts; cron is the backup.
# To stop the bot, disable this workflow. An iteration with no new question
# costs one API call and no LLM tokens. Cron uses off-peak minutes, which
# GitHub delays less.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Where to forecast"
        required: true
        default: test
        type: choice
        options: [test, tournament, minibench, cup, market_pulse]
      publish:
        description: "Submit forecasts to Metaculus"
        required: true
        default: false
        type: boolean
      loop:
        description: "Loop for 5.5 hours like the scheduled run, instead of running once"
        required: true
        default: false
        type: boolean

# One run at a time, so two runs never forecast the same question.
concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19, mid-season.
    runs-on: ubuntu-24.04
    # GitHub's hard limit is 360 minutes. The loop stops starting
    # iterations at 280 minutes and the bot step has its own 340-minute
    # limit, so the closing steps (coverage check, records) always run.
    timeout-minutes: 355
    permissions:
      contents: read
      actions: write # to queue the next run
    steps:
      - name: Queue the next run
        # Production runs only: scheduled, or manual with tournament, publish
        # and loop. The queued run waits until this one ends; a newer queued
        # run replaces it, so there is never more than one waiting.
        if: github.event_name == 'schedule' || (github.event.inputs.mode == 'tournament' && github.event.inputs.publish == 'true' && github.event.inputs.loop == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh workflow run forecast.yml --ref "${{ github.ref_name }}"
          -f mode=tournament -f publish=true -f loop=true
          || echo "could not queue the next run; cron remains the backup"

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run the bot
        timeout-minutes: 340
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Optional key of your own, used when the tournament key runs low.
          OPENROUTER_FALLBACK_KEY: ${{ secrets.OPENROUTER_FALLBACK_KEY }}
          # Optional Anthropic API key: Claude members are called directly
          # first, with OpenRouter as the fallback.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FALLBACK_BELOW: ${{ vars.FALLBACK_BELOW }}
          CALIBRATION_A: ${{ vars.CALIBRATION_A }}
          CALIBRATION_B: ${{ vars.CALIBRATION_B }}
          # Optional research providers. A missing secret arrives empty and
          # the bot skips that provider.
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          SHADOW_MODELS: ${{ vars.SHADOW_MODELS }}
          # Tournaments outside FutureEval, run Claude-only (Anthropic key),
          # comma-separated modes, e.g. "market_pulse,animal_futures".
          EXTRA_MODES: ${{ vars.EXTRA_MODES }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Scheduled run: tournament mode, publish, loop.
            MODE=tournament
            PUBLISH=true
            LOOP=true
          else
            # Manual run: exactly what was chosen in the form.
            MODE="${{ github.event.inputs.mode }}"
            PUBLISH="${{ github.event.inputs.publish }}"
            LOOP="${{ github.event.inputs.loop }}"
          fi

          ARGS="--mode $MODE"
          if [ "$PUBLISH" = "true" ]; then ARGS="$ARGS --publish"; fi
          # Manual tests are limited to 3 questions, one per type.
          if [ "$MODE" = "test" ]; then ARGS="$ARGS --limit 3"; fi
          echo "mode=$MODE publish=$PUBLISH loop=$LOOP args=[$ARGS]"

          if [ "$LOOP" != "true" ]; then
            uv run python main.py $ARGS
            exit $?
          fi

          # ---- loop for about 5 hours, forecasting every 20 minutes ----
          # Each call has a time limit, so a hung process (seen on 2026-10-09)
          # is killed and the loop goes on: 25 minutes for the main call, 15
          # for each extra tournament. The last iteration starts by 280
          # minutes, so even the slowest one ends before the step's limit.
          START=$(date +%s)
          CAP=$((4 * 3600 + 40 * 60))
          PAUSE=$((20 * 60))
          ITER=0
          while :; do
            ITER=$((ITER + 1))
            echo "::group::iteration $ITER  ($(date -u +%H:%M:%S) UTC)"
            # A failed iteration (network, rate limit, one bad question) must
            # not stop the loop; the next cycle tries again.
            timeout 1500 uv run python main.py $ARGS || echo "iteration $ITER failed or timed out, continuing"
            if [ "$PUBLISH" = "true" ] && [ -n "${EXTRA_MODES:-}" ] && [ -n "${ANTHROPIC_API_KEY:-}" ]; then
              for EXTRA in $(echo "$EXTRA_MODES" | tr ',' ' '); do
                timeout 900 uv run python main.py --mode "$EXTRA" --publish --claude-only || echo "extra mode $EXTRA failed or timed out, continuing"
              done
            fi
            echo "::endgroup::"
            NOW=$(date +%s)
            if [ $((NOW - START + PAUSE)) -ge $CAP ]; then
              echo "time cap reached after $ITER iterations; stopping so the next run takes over"
              break
            fi
            sleep $PAUSE
          done

      - name: Check for missed questions
        if: always()
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: uv run python coverage_check.py --hours 6 || echo "coverage check failed, ignoring"

      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 30

      - name: Keep forecast records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-records-${{ github.run_id }}
          path: logs/forecasts.jsonl
          if-no-files-found: ignore
          retention-days: 90
