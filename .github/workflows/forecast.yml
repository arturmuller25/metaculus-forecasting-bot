name: Forecast

# Why this workflow loops instead of relying on cron alone: questions open at
# random times and stay open for a limited window (1.5 hours in the seasonal
# tournament, 3 hours on MiniBench), while scheduled runs here started 2 to 5
# hours apart instead of every 30 minutes (measured 2026-09-19). So each
# scheduled run stays alive for up to 5.5 hours and checks for new questions
# every 20 minutes, and the next scheduled run waits in the concurrency group
# and takes over. An iteration with no new question costs one API call and no
# LLM tokens. Cron uses off-peak minutes, which GitHub delays less.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Where to forecast"
        required: true
        default: test
        type: choice
        options: [test, tournament, minibench, cup, market_pulse]
      publish:
        description: "Submit forecasts to Metaculus"
        required: true
        default: false
        type: boolean
      loop:
        description: "Loop for 5.5 hours like the scheduled run, instead of running once"
        required: true
        default: false
        type: boolean

# One run at a time, so two runs never forecast the same question.
concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    # GitHub's hard limit is 360 minutes. The loop stops by itself at about
    # 330; this only matters if a forecast hangs.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run the bot
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CALIBRATION_A: ${{ vars.CALIBRATION_A }}
          CALIBRATION_B: ${{ vars.CALIBRATION_B }}
          # Optional research providers. A missing secret arrives empty and
          # the bot skips that provider.
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          SHADOW_MODELS: ${{ vars.SHADOW_MODELS }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Scheduled run: tournament mode, publish, loop.
            MODE=tournament
            PUBLISH=true
            LOOP=true
          else
            # Manual run: exactly what was chosen in the form.
            MODE="${{ github.event.inputs.mode }}"
            PUBLISH="${{ github.event.inputs.publish }}"
            LOOP="${{ github.event.inputs.loop }}"
          fi

          ARGS="--mode $MODE"
          if [ "$PUBLISH" = "true" ]; then ARGS="$ARGS --publish"; fi
          # Manual tests are limited to 3 questions, one per type.
          if [ "$MODE" = "test" ]; then ARGS="$ARGS --limit 3"; fi
          echo "mode=$MODE publish=$PUBLISH loop=$LOOP args=[$ARGS]"

          if [ "$LOOP" != "true" ]; then
            uv run python main.py $ARGS
            exit $?
          fi

          # ---- loop for 5.5 hours, forecasting every 20 minutes ----
          START=$(date +%s)
          CAP=$((5 * 3600 + 30 * 60))
          PAUSE=$((20 * 60))
          ITER=0
          while :; do
            ITER=$((ITER + 1))
            echo "::group::iteration $ITER  ($(date -u +%H:%M:%S) UTC)"
            # A failed iteration (network, rate limit, one bad question) must
            # not stop the loop; the next cycle tries again.
            uv run python main.py $ARGS || echo "iteration $ITER failed, continuing"
            echo "::endgroup::"
            NOW=$(date +%s)
            if [ $((NOW - START + PAUSE)) -ge $CAP ]; then
              echo "time cap reached after $ITER iterations; stopping so the next run takes over"
              break
            fi
            sleep $PAUSE
          done

      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 30

      - name: Keep forecast records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-records-${{ github.run_id }}
          path: logs/forecasts.jsonl
          if-no-files-found: ignore
          retention-days: 90
