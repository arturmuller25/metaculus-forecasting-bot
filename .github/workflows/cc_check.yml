name: Claude Code check

# One real call per forecaster through cc_forecaster.py, to check that the
# Claude Code CLI works on the runner with the subscription token
# (cc_check.py). Manual only, and outside the forecast workflow's queue, so
# it runs at once. Nothing is published.
on:
  workflow_dispatch:
    inputs:
      specs:
        description: "Forecaster specs, space separated (empty: the defaults in cc_check.py)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Read by the Claude Code CLI only: it stays on the installed version.
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install the Claude Code CLI
        # The same pinned version as forecast.yml.
        run: timeout 300 npm install -g @anthropic-ai/claude-code@2.1.325 && claude --version

      - name: Call each forecaster once
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SPECS: ${{ github.event.inputs.specs }}
        run: uv run python cc_check.py $SPECS
